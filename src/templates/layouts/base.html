<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: #ffffff;
      }

      .header {
        background: #0b2a4a;
        color: #fff;
        text-align: center;
        padding: 25px;
      }

      .content {
        padding: 40px;
        color: #333;
      }

      .button {
        display: inline-block;
        background: #fdb913;
        color: #0b2a4a !important;
        padding: 14px 24px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }

      .footer {
        padding: 25px;
        text-align: center;
        background: #f5f5f5;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Innovise IT</h1>

        <p>Enterprise Careers Portal</p>
      </div>

      <div class="content">{{{body}}}</div>

      <div class="footer">
        <p>© 2026 Innovise IT</p>

        <p>Redmond, WA 98052</p>
      </div>
    </div>
  </body>
</html>
